name: Deployment checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and catalog
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          python -m json.tool config/product-platform-plugins.json > /dev/null
          if grep -q TODO_ .gitmodules; then
            echo "::error::Component URLs must be configured."
            exit 1
          fi
  registration:
    needs: configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up engine and plugin environments
        run: sh scripts/setup.sh
      - name: Plugin regression suite
        working-directory: plugins/words-cpp
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Require Words C++ serving route
        run: grep -q '/words/cpp/mcp/v1/streamable-http' engine/src/adcs/api/mcp_gateway.py
